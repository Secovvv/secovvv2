<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiTank Game</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="1920" height="950"></canvas>
  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const tank = {
      x: canvas.width / 2,
      y: canvas.height - 50,
      width: 50,
      height: 50,
      speed: 40, // Doubled tank speed
      angle: 0,
    };

    const bullets = [];
    const enemies = [];
    let score = 0;
    let gameOver = false;
    let enemySpeed = 1;

    function drawTank() {
      ctx.save();
      ctx.translate(tank.x + tank.width / 2, tank.y + tank.height / 2);
      ctx.rotate(tank.angle);
      ctx.fillStyle = "green";
      ctx.fillRect(-tank.width / 2, -tank.height / 2, tank.width, tank.height);
      ctx.restore();
    }

    function drawBullet(bullet) {
      ctx.fillStyle = "red";
      ctx.fillRect(bullet.x, bullet.y, 10, 20);
    }

    function drawEnemy(enemy) {
      ctx.fillStyle = "blue";
      ctx.fillRect(enemy.x, enemy.y, 30, 30);
    }

    function drawScore() {
      ctx.fillStyle = "black";
      ctx.font = "24px Arial";
      ctx.fillText("Score: " + score, 10, 30);
    }

    function moveTank(direction) {
      switch (direction) {
        case "left":
          tank.x -= tank.speed;
          break;
        case "right":
          tank.x += tank.speed;
          break;
        case "up":
          tank.y -= tank.speed;
          break;
        case "down":
          tank.y += tank.speed;
          break;
      }

      tank.x = Math.max(0, Math.min(canvas.width - tank.width, tank.x));
      tank.y = Math.max(0, Math.min(canvas.height - tank.height, tank.y));
    }

    function rotateTank(mouseX, mouseY) {
      const deltaX = mouseX - (tank.x + tank.width / 2);
      const deltaY = mouseY - (tank.y + tank.height / 2);
      tank.angle = Math.atan2(deltaY, deltaX);
    }

    function fireBullet(x, y) {
      if (!gameOver) {
        const bullet = {
          x: tank.x + tank.width / 2 - 5,
          y: tank.y,
          speed: 30,
          angle: Math.atan2(y - tank.y, x - tank.x),
        };
        bullets.push(bullet);
      }
    }

    function createEnemy() {
      if (!gameOver && enemies.length < 10) {
        const enemy = {
          x: Math.random() * (canvas.width - 30),
          y: 0,
          speed: enemySpeed,
        };
        enemies.push(enemy);
      }
    }

    function increaseEnemySpeed() {
      if (!gameOver) {
        enemySpeed += 1;
      }
    }

    function checkCollision() {
      for (const enemy of enemies) {
        if (
          tank.x < enemy.x + 30 &&
          tank.x + tank.width > enemy.x &&
          tank.y < enemy.y + 30 &&
          tank.y + tank.height > enemy.y
        ) {
          gameOver = true;
        }
      }
    }

    function update() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawTank();
      drawScore();

      for (const bullet of bullets) {
        drawBullet(bullet);
        bullet.x += Math.cos(bullet.angle) * bullet.speed;
        bullet.y += Math.sin(bullet.angle) * bullet.speed;
      }

      for (const enemy of enemies) {
        drawEnemy(enemy);
        enemy.y += enemy.speed;
      }

      checkCollision();

      for (let i = bullets.length - 1; i >= 0; i--) {
        if (
          bullets[i].x < 0 ||
          bullets[i].x > canvas.width ||
          bullets[i].y < 0 ||
          bullets[i].y > canvas.height
        ) {
          bullets.splice(i, 1);
        }
      }

      for (let i = enemies.length - 1; i >= 0; i--) {
        if (enemies[i].y > canvas.height) {
          enemies.splice(i, 1);
        }
      }

      for (const bullet of bullets) {
        for (const enemy of enemies) {
          if (
            bullet.x < enemy.x + 30 &&
            bullet.x + 10 > enemy.x &&
            bullet.y < enemy.y + 30 &&
            bullet.y + 20 > enemy.y
          ) {
            bullets.splice(bullets.indexOf(bullet), 1);
            enemies.splice(enemies.indexOf(enemy), 1);
            score += 1;
          }
        }
      }

      if (enemies.some(enemy => enemy.y >= 950 - 30)) {
        gameOver = true;
      }

      if (gameOver) {
        ctx.fillStyle = "red";
        ctx.font = "40px Arial";
        ctx.fillText("Game Over", canvas.width / 2 - 100, canvas.height / 2);
      } else {
        requestAnimationFrame(update);
      }
    }

    window.addEventListener("keydown", (e) => {
      switch (e.key) {
        case "ArrowLeft":
          moveTank("left");
          break;
        case "ArrowRight":
          moveTank("right");
          break;
        case "ArrowUp":
          moveTank("up");
          break;
        case "ArrowDown":
          moveTank("down");
          break;
      }
    });

    window.addEventListener("mousemove", (e) => {
      rotateTank(e.clientX, e.clientY);
    });

    window.addEventListener("mousedown", (e) => {
      fireBullet(e.clientX, e.clientY);
    });

    setInterval(createEnemy, 1000);

    setInterval(() => {
      increaseEnemySpeed();
      createEnemy(); // Create a new enemy every 10 seconds
    }, 10000);

    update();
  </script>
</body>
</html>
