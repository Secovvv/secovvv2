<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f0f0;
            color: black;
        }

        #clock {
            font-size: 36px;
            color: blue;
        }

        #date {
            font-size: 24px;
            color: green;
        }

        #specialEvents {
            font-size: 18px;
            color: red;
            margin-top: 20px;
           position:absolute;
 left: 25px; 

        }

        #imageContainer {
            margin-top: 0px;
            top: 5px;
            left: -160px; 
            position:absolute;
        }
    </style>
    <title>Dijital Saat</title>
</head>
<body>
    <div id="clock"></div>
    <div id="date"></div>
    <div id="specialEvents"></div>
    <div id="imageContainer"></div>

    <script>
        function updateClock() {
            var now;
            
            if (navigator.onLine) {
                now = new Date(); // İnternet saati kullanılabilirse
            } else {
                now = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/New_York' })); // Yerel saat
            }

            var hours = now.getHours();
            var minutes = now.getMinutes();
            var seconds = now.getSeconds();

            var day = now.getDate();
            var month = now.getMonth() + 1;
            var year = now.getFullYear();

            var clockElement = document.getElementById("clock");
            var dateElement = document.getElementById("date");
            var specialEventsElement = document.getElementById("specialEvents");
            var imageContainer = document.getElementById("imageContainer");

            var timeString = hours.toString().padStart(2, '0') + ":" + minutes.toString().padStart(2, '0') + ":" + seconds.toString().padStart(2, '0');
            var dateString = day + "/" + month + "/" + year;

            clockElement.innerHTML = timeString;
            dateElement.innerHTML = dateString;

            // Özel gün kontrolü
            specialEventsElement.innerHTML = ""; // Her güncellemede temizle

            if (month === 7 && day === 9) {
                specialEventsElement.innerHTML += "MUTLU YILLAR SEÇKİN<br>";
            }

            if (month === 11 && day === 26) {
                specialEventsElement.innerHTML += "MUTLU YILLAR İPEK<br>";
            }

            if (month === 10 && day === 13) {
                specialEventsElement.innerHTML += "MUTLU YILLAR EMEL<br>";
            }

               if (month === 12 && day === 10) {
                specialEventsElement.innerHTML += "MUTLU YILLAR SADETTİN<br>";
            }

               if (month === 3 && day === 5) {
                specialEventsElement.innerHTML += "MUTLU YILLAR OSMAN<br>";
            }

               if (month === 7 && day === 14) {
                specialEventsElement.innerHTML += "MUTLU YILLAR KAĞAN<br>";
            }

            if (month === 8 && day === 30) {
                specialEventsElement.innerHTML += "30 AĞUSTOS ZAFER BAYRAMIMIZ KUTLU OLSUN<br>";
            }

            if (month === 10 && day === 29) {
                specialEventsElement.innerHTML += "29 EKİM CUMHURİYET BAYRAMIMIZ KUTLU OLSUN<br>";
            }

            if (month === 1 && day === 1) {

            }

            }

            }

        // Saati güncellemek için her saniyede bir fonksiyonu çağır
        setInterval(updateClock, 1000);

        // Sayfa yüklendiğinde saati ve tarihi güncelle
        window.onload = function () {
            updateClock();
        };
    </script>
</body>
</html>
