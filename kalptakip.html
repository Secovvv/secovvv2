
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Page Title</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: black;
            color: white; /* Set text color to contrast with the background */
            font-family: Arial, sans-serif; /* Set a suitable font */
        }

        #canvasContainer {
            position: relative;
            z-index: 1; /* Set a high z-index value */
        }

        canvas {
            display: block;
        }

        
      
    </style>
</head>
<body>

    <div id="canvasContainer">
        <canvas id="heartCanvas"></canvas>
    </div>

   

    <script>
            const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];

        class Particle {
            constructor(x, y, size, color, lifetime) {
                this.x = x;
                this.y = y;
                this.size = size;
                this.color = color;
                this.lifetime = lifetime;
                this.speedX = Math.random() * 3 - 1.5;
                this.speedY = Math.random() * 3 - 1.5;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                this.lifetime -= 1;

                if (this.lifetime <= 0) {
                    return; // Don't check boundaries if lifetime is zero
                }

                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.lifetime = 0;
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;

                ctx.beginPath();
                ctx.moveTo(this.x, this.y - this.size);

                ctx.bezierCurveTo(
                    this.x + 5, this.y - this.size - 5,
                    this.x + 10, this.y - this.size / 2 - 5,
                    this.x, this.y + this.size
                );

                ctx.bezierCurveTo(
                    this.x - 10, this.y - this.size / 2 - 5,
                    this.x - 5, this.y - this.size - 5,
                    this.x, this.y - this.size
                );

                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }
        }

        function createParticles(event, particleCount) {
            const fixedSize = 5; // Set a larger fixed size for the particles

            for (let i = 0; i < particleCount; i++) {
                const x = event.x;
                const y = event.y;
                const color = getRandomColor();
                const lifetime = 5 * 10;
                particles.push(new Particle(x, y, fixedSize, color, lifetime));
            }
        }

        function getRandomColor() {
            const colors = ['#F40009', '#8B0000', '#ED2939', '#fd5c63', '#FF033E'];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();

                if (particles[i].lifetime <= 0) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(animateParticles);
        }

        window.addEventListener('mousemove', (event) => {
            createParticles(event, 2);
        });

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            for (let i = particles.length - 1; i >= 0; i--) {
                if (particles[i].x > canvas.width || particles[i].y > canvas.height) {
                    particles.splice(i, 1);
                }
            }
        });

        animateParticles();
    </script>
</body>
</html>
